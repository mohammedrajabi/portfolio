<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A preview of the design foundation for Mohammed Rajabi’s developer portfolio."
    />
    <meta property="og:title" content="Mohammed Rajabi — Foundation Preview" />
    <meta
      property="og:description"
      content="A preview of the design foundation for Mohammed Rajabi’s developer portfolio."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#F6F4ED" />
    <title>Mohammed Rajabi — Foundation Preview</title>
    <script>
      try {
        const p = localStorage.getItem("mr-theme");
        const t =
          p === "light" || p === "dark"
            ? p
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
