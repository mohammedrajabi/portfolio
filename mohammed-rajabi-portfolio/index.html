      property="og:description"
      content="Mohammed Rajabi — software developer and cybersecurity enthusiast. Driven by curiosity, creativity, and a passion for building better."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#F6F4ED" />
    <title>Mohammed Rajabi — Developer &amp; Cybersecurity Enthusiast</title>
    <script>
      try {
        const p = localStorage.getItem("mr-theme");
        const t =
          p === "light" || p === "dark"
            ? p
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
